<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Aethoria Chronicles</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Raleway:wght@400;600&display=swap" rel="stylesheet">
</head>

<body>

    <header>
        <div class="header-content">
            <h1>Aethoria Chronicles</h1>
            <p class="lema">La base de datos definitiva del mundo de Aethoria</p>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="clases.html">Clases</a></li>
                <li><a href="items.html">Items</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <section id="contacto">
            <h2>Contacto</h2>
            <p>¿Tienes alguna duda, sugerencia o has encontrado un error en la base de datos? Escríbenos.</p>

            <form>
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" placeholder="Tu nombre">

                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" placeholder="tu@email.com">

                <label for="asunto">Asunto</label>
                <input type="text" id="asunto" name="asunto" placeholder="Motivo del mensaje">

                <label for="mensaje">Mensaje</label>
                <textarea id="mensaje" name="mensaje" placeholder="Escribe tu mensaje aquí..."></textarea>

                <button type="submit">Enviar mensaje</button>
            </form>
        </section>

    </main>

    <footer>
        <p>&copy; 2025 Aethoria Chronicles Database Platform</p>
        <p>Proyecto Intermodular 1º DAW</p>
    </footer>

</body>

</html>
